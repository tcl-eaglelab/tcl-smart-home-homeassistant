set_property:
  name: Set property
  description: Administrator-only action for explicitly approved TCL capabilities. A user context is required; use entity actions for automations.
  fields:
    device_id:
      name: Device ID
      description: The TCL deviceId.
      required: true
      selector:
        text:
    property:
      name: Property
      description: An approved property identifier. Engineering and lock controls are rejected.
      required: true
      selector:
        text:
    value:
      name: Value
      description: Property value. Use 0 or 1 for a boolean, a number for a range, or the option code for an enum.
      required: true
      selector:
        text:
